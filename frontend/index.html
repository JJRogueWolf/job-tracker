
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app">

        <header class="header">
            <h1>Job Tracker</h1>
            <button id="add-job-btn">+ Add Job</button>
        </header>

        <main>
            <section class="dashboard">
                <h2>Dashboard</h2>
                <p>Manage and track your job applications.</p>

                <div class="stats">
                    <div class="stat-card">
                        <h3>Total Applications</h3>
                        <span id="total-count">0</span>
                    </div>

                    <div class="stat-card">
                        <h3>Interviews</h3>
                        <span id="interview-count">0</span>
                    </div>

                    <div class="stat-card">
                        <h3>Offers</h3>
                        <span id="offer-count">0</span>
                    </div>
                </div>
            </section>

            <section class="applications">
                <h2>Recent Applications</h2>
                <div class="job-toolbar">
                    <input
                        type="search"
                        id="job-search"
                        placeholder="Search company or position..."
                    >

                    <select id="status-filter">
                        <option value="All">All Statuses</option>
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Offer">Offer</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <div id="job-list">
                    <p class="empty-message">No applications yet.</p>
                </div>
            </section>
        </main>

    </div>

    <dialog id="job-dialog">
        <form id="job-form">
            <h2>Add Job Application</h2>

            <label for="company">Company</label>
            <input type="text" id="company" name="company" required>

            <label for="position">Job Title</label>
            <input type="text" id="position" name="position" required>

            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
            </select>

            <label for="applied-date">Application Date</label>
            <input type="date" id="applied-date" name="appliedDate" required>

            <div class="form-actions">
                <button type="button" id="cancel-job-btn">Cancel</button>
                <button type="submit">Save Application</button>
            </div>
        </form>
    </dialog>


    <script src="js/app.js"></script>
</body>
</html>
